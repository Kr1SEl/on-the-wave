<!-- Parallax Section -->
<div class="relative h-[500px] overflow-hidden">
    <!-- Background with Rellax -->
    <div class="absolute top-0 left-0 w-full h-full bg-cover bg-center"
        style="background-image: url('https://images.unsplash.com/photo-1519046904884-53103b34b206?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');"
        data-rellax-speed="-3">
        <div class="absolute inset-0 bg-black/60"></div> <!-- gradient overlay -->
    </div>

    <!-- Content -->
    <div class="relative max-w-4xl mx-auto text-center px-4 h-full flex flex-col justify-center">
        <h2 class="text-3xl md:text-4xl font-bold text-white mb-6" data-translate="parallax.title"></h2>
        <p class="text-xl text-gray-200 mb-8" data-translate="parallax.subtitle"></p>
        <button id="parallaxButton" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-lg
            transition duration-300" data-translate="parallax.btn"></button>
    </div>
</div>
