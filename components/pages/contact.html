<section class="contact-header">
    <div id="header-image" class="header-image">
        <img src="/on-the-wave/resources/media/yacht/yacht_1.webp" alt="" role="presentation" class="img-fluid">
        <div class="header-image-overlay">
            <h1 class="text-center" id="page-title" data-translate="page-title"></h1>
            <p class="text-center" id="page-subtitle" data-translate="page-subtitle"></p>
        </div>
    </div>
</section>

<section class="contact-section">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="contact-box">
                    <h2 class="text-primary" data-translate="write-to-us"></h2>
                    <p data-translate="write-to-us-subtitle"></p>
                    <form id="contactForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" placeholder="Your Email" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="phone" placeholder="Phone Number" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" id="message" rows="4" placeholder="Your Message"
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-custom" data-translate="send-message"></button>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="contact-box">
                    <h2 class="text-primary" data-translate="contacts"></h2>

                    <div class="contact-card">
                        <img src="https://flagcdn.com/w40/ua.png" alt="Ukraine">
                        <p data-translate="phone-one"></p>
                    </div>

                    <div class="contact-card">
                        <img src="https://flagcdn.com/w40/ua.png" alt="Ukraine">
                        <p data-translate="phone-two"></p>
                    </div>

                    <div class="contact-card">
                        <img src="https://flagcdn.com/w40/us.png" alt="USA">
                        <p>+123456789</p>
                    </div>

                    <div class="contact-card">
                        <img src="https://flagcdn.com/w40/pl.png" alt="PL">
                        <p>+48123456789</p>
                    </div>

                    <h4 class="mt-4" data-translate="follow-us"></h4>
                    <div class="social-icons">
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-telegram"></i></a>
                        <a href="#"><i class="fab fa-facebook"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
