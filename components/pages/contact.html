<!-- Hero Section -->
<section class="wave-bg text-white pt-20 pb-10 relative">
    <div class="container mx-auto px-6 relative z-10">
        <br><br>
        <h1 class="text-4xl md:text-6xl font-bold mb-4" data-translate="page-title"></h1>
        <p class="text-xl md:text-2xl mb-6" data-translate="page-subtitle"></p>
    </div>
</section>

<div id="alertContainer" class="container mt-4"></div>

<!-- Main Content -->
<div class="container mx-auto px-6 py-16">
    <div class="flex flex-col lg:flex-row gap-12 items-stretch">
        <!-- Contact Form -->
        <div class="lg:w-1/2 flex flex-col">
            <div class="bg-white rounded-xl shadow-lg p-8 flex-1">
                <h2 class="text-3xl font-bold text-gray-800 mb-6" data-translate="message-form-title"></h2>
                <form id="contactForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-gray-700 font-medium mb-2"
                                data-translate="customer-name"></label>
                            <input id="name" type="text" name="name" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 form-input">
                        </div>
                        <div>
                            <label for="phone" class="block text-gray-700 font-medium mb-2"
                                data-translate="customer-phone"></label>
                            <input id="phone" type="tel" name="phone"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 form-input">
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block text-gray-700 font-medium mb-2"
                            data-translate="customer-email"></label>
                        <input id="email" type="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 form-input">
                    </div>
                    <div>
                        <label for="message" class="block text-gray-700 font-medium mb-2"
                            data-translate="customer-message"></label>
                        <textarea id="message" name="message" rows="5" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 form-input"></textarea>
                    </div>
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300"
                        data-translate="send-message">
                    </button>
                </form>
                <div id="formSuccess" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-lg">
                    Thank you for your message! We'll get back to you soon.
                </div>
                <div id="formError" class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded-lg">
                    There was an error sending your message. Please try again later.
                </div>
            </div>
        </div>

        <!-- Contact Info -->
        <div class="lg:w-1/2 flex flex-col h-full">
            <div class="bg-white rounded-xl shadow-lg p-8 contact-card">
                <h2 class="text-3xl font-bold text-gray-800 mb-6" data-translate="contact-info"></h2>
                <div class="space-y-6">
                    <div class="flex items-start">
                        <div class="bg-blue-100 p-3 rounded-full mr-4">
                            <i class="fas fa-phone-alt text-blue-600 text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800" data-translate="text-phone"></h3>
                            <p class="text-gray-600">
                                <a href="tel" class="hover:underline" data-translate="phone-one"></a>
                                <br>
                                <a href="tel" class="hover:underline" data-translate="phone-two"></a>
                            </p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="bg-blue-100 p-3 rounded-full mr-4">
                            <i class="fas fa-envelope text-blue-600 text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800" data-translate="text-email"></h3>
                            <p class="text-gray-600">
                                <a href="mailto" class="hover:underline" data-translate="email"></a><br>
                            </p>
                        </div>
                    </div>
                    <div class="flex items-start">
                        <div class="bg-blue-100 p-3 rounded-full mr-4">
                            <i class="fas fa-clock text-blue-600 text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800" data-translate="text-working-hours"></h3>
                            <p class="text-gray-600" data-translate="working-hours-1"></p>
                            <p class="text-gray-600" data-translate="working-hours-2"></p>
                            <p class="text-gray-600" data-translate="working-hours-3"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-lg p-8 contact-card mt-10">
                <h2 class="text-2xl font-bold text-gray-800 mb-6" data-translate="find-us"></h2>
                <div class="flex space-x-4">
                    <a href="https://www.facebook.com/share/14DhxxfQuHg/?mibextid=wwXIfr"
                        class="bg-blue-600 text-white w-14 h-14 flex items-center justify-center rounded-full hover:bg-blue-700 transition duration-300"
                        target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-facebook-f text-3xl"></i>
                    </a>
                    <a href="https://www.instagram.com/onthewaveyachting/"
                        class="bg-pink-600 text-white w-14 h-14 flex items-center justify-center rounded-full hover:bg-pink-700 transition duration-300"
                        target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-instagram text-3xl"></i>
                    </a>
                    <a href="https://t.me/+UJVC01DzEiStD15a"
                        class="bg-blue-400 text-white w-14 h-14 flex items-center justify-center rounded-full hover:bg-blue-500 transition duration-300"
                        target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-telegram text-3xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
