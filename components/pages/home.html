<div id="alertContainer" class="container mt-4"></div>

<section class="video-section">
    <div class="relative w-full h-screen overflow-hidden">
        <div class="absolute inset-0">
            <video autoplay muted loop playsinline class="w-full h-full object-cover brightness-90 contrast-110">
                <source src="/on-the-wave/resources/media/home.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40"></div>
            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_60%,rgba(0,0,0,0.3)_100%)]">
            </div>
        </div>

        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full animate-shine">
                <div
                    class="absolute top-0 left-[-100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/20 to-transparent skew-x-[-20deg]">
                </div>
            </div>
        </div>

        <div class="relative z-10 flex flex-col items-center justify-center h-full text-white">
            <div class="video-overlay">
                <div class="gap">
                    <h1 class="text-center text-3xl md:text-4xl lg:text-5xl font-bold" data-translate="title"></h1>
                    <p class="text-center text-lg md:text-xl" data-translate="subtitle"></p>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="facts">
    <div class="container mx-auto text-center">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">

            <!-- Fact 1 -->
            <div class="flex flex-col items-center">
                <div class="bg-blue-100 p-3 rounded-full mb-4 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-600" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path
                            d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zM18 9H2v7a2 2 0 002 2h12a2 2 0 002-2V9z" />
                    </svg>
                </div>
                <h3 class="text-xl md:text-2xl font-bold text-white" data-translate="fact-one-title"></h3>
                <p class="text-base md:text-lg text-gray-100" data-translate="fact-one-subtitle"></p>
            </div>

            <!-- Fact 2 -->
            <div class="flex flex-col items-center">
                <div class="bg-green-100 p-3 rounded-full mb-4 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M16.707 5.293a1 1 0 010 1.414L8.414 15 4.293 10.879a1 1 0 011.414-1.414L8.414 12.586l7.293-7.293a1 1 0 011.414 0z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <h3 class="text-xl md:text-2xl font-bold text-white" data-translate="fact-two-title"></h3>
                <p class="text-base md:text-lg text-gray-100" data-translate="fact-two-subtitle"></p>
            </div>

            <!-- Fact 3 -->
            <div class="flex flex-col items-center">
                <div class="bg-yellow-100 p-3 rounded-full mb-4 shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-500" fill="currentColor"
                        viewBox="0 0 20 20">
                        <path
                            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.97a1 1 0 00.95.69h4.178c.969 0 1.371 1.24.588 1.81l-3.385 2.466a1 1 0 00-.364 1.118l1.287 3.97c.3.922-.755 1.688-1.54 1.118l-3.385-2.466a1 1 0 00-1.176 0l-3.385 2.466c-.784.57-1.838-.196-1.539-1.118l1.287-3.97a1 1 0 00-.364-1.118L2.048 9.397c-.783-.57-.38-1.81.588-1.81h4.178a1 1 0 00.95-.69l1.285-3.97z" />
                    </svg>
                </div>
                <h3 class="text-xl md:text-2xl font-bold text-white" data-translate="fact-three-title"></h3>
                <p class="text-base md:text-lg text-gray-100" data-translate="fact-three-subtitle"></p>
            </div>

        </div>
    </div>
</section>

<section id="gallerySection" class="gallery py-5">
    <div class="container">
        <h2 class="text-center text-3xl md:text-4xl font-bold mb-4 wave-header" data-translate="highlights"></h2>
        <div class="waveWidget"></div>
        <div class="gallery-grid">
            <!-- JS -->
        </div>
    </div>
</section>

<section id="toursSection" class="destinations py-5">
    <div class="container">
        <h2 class="text-center text-3xl md:text-4xl font-bold mb-4 wave-header" data-translate="destinations"></h2>
        <div class="waveWidget"></div>

        <div id="toursCarousel" class="carousel slide">
            <div id="carouselContent" class="carousel-inner">
                <!-- JS Injected Cards -->
            </div>

            <button class="carousel-control-prev d-none d-md-block" type="button" data-bs-target="#toursCarousel"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next d-none d-md-block" type="button" data-bs-target="#toursCarousel"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <div class="carousel-controls-container d-md-none text-center mt-3">
            <button class="carousel-control-prev" type="button" data-bs-target="#toursCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#toursCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
        <div class="text-center mt-4">
            <button id="allToursButton" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-lg
            transition duration-300" data-translate="all-tours-btn"></button>
        </div>
    </div>
</section>
