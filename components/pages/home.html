<div id="alertContainer" class="container mt-4"></div>

<section class="video-section">
    <div class="relative w-full h-screen overflow-hidden">
        <div class="absolute inset-0">
            <video autoplay muted loop class="w-full h-full object-cover brightness-90 contrast-110">
                <source src="/on-the-wave/resources/media/home.mp4" type="video/mp4">
            </video>
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/40"></div>
            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_60%,rgba(0,0,0,0.3)_100%)]">
            </div>
        </div>

        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full animate-shine">
                <div
                    class="absolute top-0 left-[-100%] w-1/2 h-full bg-gradient-to-r from-transparent via-white/20 to-transparent skew-x-[-20deg]">
                </div>
            </div>
        </div>

        <div class="relative z-10 flex flex-col items-center justify-center h-full text-white">
            <div class="video-overlay">
                <div class="gap">
                    <h1 class="text-center text-3xl md:text-4xl lg:text-5xl font-bold" data-translate="title"></h1>
                    <p class="text-center text-lg md:text-xl" data-translate="subtitle"></p>
                </div>
            </div>
        </div>
    </div>
</section>

<section class="facts">
    <div class="container text-center">
        <div class="row gap">
            <div class="col-md-4">
                <h3 class="text-xl md:text-2xl font-semibold" data-translate="fact-one-title"></h3>
                <p class="text-base md:text-lg" data-translate="fact-one-subtitle"></p>
            </div>
            <div class="col-md-4">
                <h3 class="text-xl md:text-2xl font-semibold" data-translate="fact-two-title"></h3>
                <p class="text-base md:text-lg" data-translate="fact-two-subtitle"></p>
            </div>
            <div class="col-md-4">
                <h3 class="text-xl md:text-2xl font-semibold" data-translate="fact-three-title"></h3>
                <p class="text-base md:text-lg" data-translate="fact-three-subtitle"></p>
            </div>
        </div>
    </div>
</section>

<section id="gallerySection" class="gallery py-5">
    <div class="container">
        <h2 class="text-center text-3xl md:text-4xl font-bold mb-4 wave-header" data-translate="highlights"></h2>
        <div class="waveWidget"></div>
        <div class="gallery-grid">
            <!-- JS -->
        </div>
        <div class="text-center mt-4">
            <!-- <a href="tours.html" class="btn btn-outline-primary text-base md:text-lg"
                data-translate="find-more-gallery-btn"></a> -->
        </div>
    </div>
</section>

<section id="toursSection" class="destinations py-5">
    <div class="container">
        <h2 class="text-center text-3xl md:text-4xl font-bold mb-4 wave-header" data-translate="destinations"></h2>
        <div class="waveWidget"></div>

        <div id="toursCarousel" class="carousel slide">
            <div id="carouselContent" class="carousel-inner">
                <!-- JS Injected Cards -->
            </div>

            <button class="carousel-control-prev d-none d-md-block" type="button" data-bs-target="#toursCarousel"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next d-none d-md-block" type="button" data-bs-target="#toursCarousel"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <div class="carousel-controls-container d-md-none text-center mt-3">
            <button class="carousel-control-prev" type="button" data-bs-target="#toursCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#toursCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</section>
