<div id="alert-container" class="container mt-4"></div>

<section class="video-section">
    <video autoplay muted loop class="w-100">
        <source src="/on-the-wave/resources/media/home.mp4" type="video/mp4">
        Sorry, your browser does not support the video tag.
    </video>
    <div class="video-overlay">
        <div class="gap">
            <h1 class="text-center" data-translate="title"></h1>
            <p class="text-center" data-translate="subtitle"></p>
        </div>
    </div>
</section>

<section class="hero">
    <div class="container text-center">
        <div class="row gap">
            <div class="col-md-4">
                <h3 data-translate="fact-one-title"></h3>
                <p data-translate="fact-one-subtitle"></p>
            </div>
            <div class="col-md-4">
                <h3 data-translate="fact-two-title"></h3>
                <p data-translate="fact-two-subtitle"></p>
            </div>
            <div class="col-md-4">
                <h3 data-translate="fact-three-title"></h3>
                <p data-translate="fact-three-subtitle"></p>
            </div>
        </div>
    </div>
</section>

<section class="gallery py-5">
    <div class="container">
        <h2 class="text-center mb-4 wave-header" data-translate="highlights"></h2>
        <div class="waveWidget"></div>
        <div class="gallery-grid">
            <!-- JS -->
        </div>
        <div class="text-center mt-4">
            <a href="tours.html" class="btn btn-outline-primary" data-translate="find-more-gallery-btn"></a>
        </div>
    </div>
</section>

<section class="main py-5">
    <div class="container">
        <h2 class="text-center mb-4 wave-header" data-translate="destinations"></h2>
        <div class="waveWidget"></div>
        <div id="toursCarousel" class="carousel slide">
            <div class="carousel-inner" id="carouselContent">
                <!-- JS -->
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#toursCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#toursCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <div class="text-center mt-4">
            <a href="tours.html" class="btn btn-outline-primary" data-translate="all-tours-btn"></a>
        </div>
    </div>
</section>

<section class="cta-section py-5">
    <div class="container d-flex flex-column flex-lg-row align-items-center">
        <div class="cta-image">
            <img src="/on-the-wave/resources/media/fun/fun_2.webp" alt="Jump into the trip"
                class="img-fluid rounded-circle cropped-img">
        </div>
        <div class="cta-content text-center text-lg-start ms-lg-4 mt-4 mt-lg-0">
            <h2>Ready to jump into the trip together?</h2>
            <p class="mb-4">Contact us to make your next adventure unforgettable!</p>
            <button id="contactButton" class="btn btn-primary">Contact Us</button>
        </div>
    </div>
</section>
